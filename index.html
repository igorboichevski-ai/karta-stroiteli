<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Карта строителей</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/favicon.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="theme-color" content="#2f7d4f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Карта">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
:root{
  --bg:#f3f5f1; --panel:#fff; --fg:#1d2a22; --muted:#5d6b62; --line:#d9e0d8; --sel:#e9f3ec; --accent:#2f7d4f; --danger:#b3261e; --sel-ring:#e8590c;
  --cand:#e0a800; --build:#d9480f; --wcol:#2b8a3e; --wproc:#1971c2; --wtrade:#7048e8; --other:#868e96; --refused:#ff0000; --me:#1a73e8;
  --f-display:"Fraunces",Georgia,serif; --f-body:"IBM Plex Sans","Segoe UI",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#121814; --panel:#18211b; --fg:#e3eae4; --muted:#9aa89e; --line:#2a362d; --sel:#1f3326; --accent:#5cc185; --danger:#ff8a80; --sel-ring:#ffa94d;
  --cand:#ffd24d; --build:#ff8a4c; --wcol:#5cc185; --wproc:#5ca8f0; --wtrade:#a891f0; --other:#adb5bd; --refused:#ff2a2a; --me:#4c9aff; color-scheme:dark}}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font:14px/1.4 var(--f-body)}
button,input,select,textarea{font:inherit;color:inherit}
input,select,textarea{background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:7px 9px;width:100%;box-sizing:border-box}
textarea{resize:vertical;min-height:60px}
button{cursor:pointer;border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:7px 12px}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:500}
button.danger{color:var(--danger)}
:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
h1,h2{font-family:var(--f-display);font-weight:600;margin:0}
.k{color:var(--muted);font-size:12px}
/* login */
#login{min-height:100%;display:grid;place-items:center;padding:16px;box-sizing:border-box}
#login form{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:24px;width:min(360px,100%);display:grid;gap:12px;box-sizing:border-box}
.err{color:var(--danger);font-size:13px}
/* app */
#app{height:100%;display:grid;grid-template-columns:350px 1fr}
aside{background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0;min-width:0}
.head{padding:14px 16px;display:grid;gap:8px;border-bottom:1px solid var(--line)}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.row{display:flex;gap:6px}
#list{list-style:none;margin:0;padding:0;overflow:auto;flex:1}
#list li{padding:8px 16px;border-bottom:1px solid var(--line);cursor:pointer;display:grid;grid-template-columns:auto 1fr auto;gap:2px 10px;align-items:baseline}
#list li:hover,#list li.on{background:var(--sel)}
#list .r{grid-column:2/4;color:var(--muted);font-size:12px}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%}
.pill{font-size:11px;padding:1px 7px;border-radius:99px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.pill.client{border-color:var(--accent);color:var(--accent)}
.pill.refused{border-color:var(--refused);color:var(--refused);font-weight:600}
.refnote{border:1px solid var(--danger);color:var(--danger);border-radius:6px;padding:6px 8px;font-size:13px}
#list li.hid{opacity:.6}
.chk{display:flex;align-items:center;gap:6px;cursor:pointer}
.chk input{width:auto;margin:0}
.hidnote{background:var(--sel);border-radius:6px;padding:6px 8px;font-size:13px}
.mapwrap{position:relative;min-width:0}
#map{position:absolute;inset:0}
#panel{position:absolute;top:12px;right:12px;bottom:12px;z-index:1000;width:min(380px,calc(100% - 24px));background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:0 8px 28px rgb(0 0 0/.15);display:flex;flex-direction:column;min-height:0}
#panel .ph{padding:14px 16px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:8px;align-items:start}
#panel .pb{padding:12px 16px;overflow:auto;display:grid;gap:10px;align-content:start}
#panel label{display:grid;gap:3px;font-size:12px;color:var(--muted)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.locbtn{width:34px;height:34px;padding:0;display:grid;place-items:center;font-size:18px;line-height:1;background:var(--panel);color:var(--fg);border:0;border-radius:4px}
.locbtn.on{color:var(--me)}
.rlabel{background:none;border:0;box-shadow:none;padding:0;font-size:11px;font-weight:500;color:#3b4a40;text-shadow:0 0 3px #fff,0 0 3px #fff}
.rlabel.obl{font-size:14px;font-weight:600;color:#1d2a22}
.rlabel::before{display:none}
/* флажки визитов и меню статусов с флажками */
.flagicon{background:none;border:0}
.flagicon svg{display:block;filter:drop-shadow(0 1px 1.5px rgb(0 0 0/.45))}
.flagicon.hid{opacity:.6}
.fsel{position:relative;flex:1 1 0;min-width:0}
.row>select{flex:1 1 0;min-width:0}
.fsel-btn{width:100%;display:flex;align-items:center;gap:7px;background:var(--bg);text-align:left;padding:7px 9px;min-height:34px}
.fsel-btn span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fsel-btn i{font-style:normal;color:var(--muted);font-size:11px}
.fsel-list{position:absolute;left:0;top:100%;z-index:2100;min-width:100%;box-sizing:border-box;margin:2px 0 0;padding:4px 0;list-style:none;background:var(--panel);border:1px solid var(--line);border-radius:8px;box-shadow:0 8px 24px rgb(0 0 0/.18);max-height:320px;overflow:auto}
.fsel-list li{display:flex;align-items:center;gap:8px;padding:7px 12px;cursor:pointer;white-space:nowrap;color:var(--fg)}
.fsel-list li:hover,.fsel-list li.on{background:var(--sel)}
.fsel-btn .fsel-nf,.fsel-nf{display:inline-block;width:14px;flex:none}
.yearbox select{font:inherit;font-size:13px;padding:5px 6px;border:0;border-radius:4px;background:var(--panel);color:var(--fg)}
.locbtn.wait{animation:locblink 1s infinite}
@keyframes locblink{50%{opacity:.4}}
.comment{border-left:3px solid var(--line);padding:2px 0 2px 8px}
#addHint{position:absolute;left:50%;top:12px;transform:translateX(-50%);z-index:1000;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px 12px}
.leaflet-container{background:var(--bg);font-family:var(--f-body)}
.coords{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
a.btn{display:inline-block;text-decoration:none;color:inherit;border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:7px 12px}
a.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.visit{border:1px solid var(--accent);border-radius:8px;padding:10px;display:grid;gap:8px}
.vitem{border-left:3px solid var(--accent);padding:2px 0 2px 8px}
.vitem.queued{border-left-color:var(--cand)}
.vitem .del{float:right;padding:2px 8px;font-size:12px}
#report{position:fixed;inset:0;z-index:2000;background:rgb(0 0 0/.4);display:grid;place-items:center;padding:16px;box-sizing:border-box}
.rbox{background:var(--panel);border:1px solid var(--line);border-radius:12px;width:min(1200px,100%);height:100%;max-height:900px;display:flex;flex-direction:column;min-height:0}
.rbox .ph{padding:14px 16px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:8px;align-items:center}
.rctl{display:flex;flex-wrap:wrap;gap:8px;align-items:end;padding:12px 16px}
.rctl label{display:grid;gap:3px;font-size:12px;color:var(--muted)}
.rctl input,.rctl select{width:auto}
#rSum{padding:0 16px 8px}
.rtable{overflow:auto;padding:0 16px 16px;flex:1;min-height:0}
.rtable table{border-collapse:collapse;font-size:13px;min-width:100%}
.rtable th,.rtable td{border-bottom:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top}
.rtable th{position:sticky;top:0;background:var(--panel);font-weight:600;white-space:nowrap}
.rtable td.c{cursor:pointer;color:var(--accent)}
@media (max-width:760px){#report{padding:0}.rbox{border-radius:0;max-height:none}}
#mnav{display:none}
#offNote{position:absolute;left:50%;top:12px;transform:translateX(-50%);z-index:900;background:var(--cand);color:#1d2a22;border-radius:99px;padding:5px 12px;font-size:13px;font-weight:500;white-space:nowrap;box-shadow:0 2px 8px rgb(0 0 0/.2)}
/* телефон: карта на весь экран, список отдельной вкладкой, внизу переключатель */
@media (max-width:760px){
  input,select,textarea,.fsel-btn{font-size:16px}
  #app{display:block;position:relative;height:100%}
  .mapwrap,aside{position:absolute;left:0;right:0;top:0;bottom:calc(56px + env(safe-area-inset-bottom))}
  aside{z-index:1500;border-right:0;overflow:auto;display:none}
  #app.m-list aside{display:flex}
  #list{overflow:visible;flex:none}
  #list li{padding:11px 16px}
  #addBtn{display:none}
  #mnav{display:flex;position:absolute;left:0;right:0;bottom:0;height:56px;padding-bottom:env(safe-area-inset-bottom);background:var(--panel);border-top:1px solid var(--line);z-index:1600}
  #mnav button{flex:1;border:0;border-radius:0;background:none;font-weight:500;color:var(--muted)}
  #mnav button.on{color:var(--accent);box-shadow:inset 0 3px var(--accent)}
  #mnav #mAdd{color:var(--accent)}
  #panel{top:auto;left:0;right:0;bottom:0;width:auto;height:65%;border-radius:14px 14px 0 0;border-bottom:0}
  #addHint{top:auto;bottom:12px;width:max-content;max-width:calc(100% - 24px);box-shadow:0 4px 16px rgb(0 0 0/.2)}
}
</style>
</head>
<body>
<div id="login" hidden>
  <form id="loginForm">
    <h1>Карта строителей</h1>
    <p class="k">Войдите под учётной записью, которую вам выдал администратор.</p>
    <input id="email" type="email" placeholder="Электронная почта" autocomplete="username" required>
    <input id="password" type="password" placeholder="Пароль" autocomplete="current-password" required>
    <button class="primary" type="submit">Войти</button>
    <div class="err" id="loginErr"></div>
  </form>
</div>

<div id="app" hidden>
  <aside>
    <div class="head">
      <div class="top"><h1 style="font-size:20px">Карта</h1><span class="k" id="me"></span></div>
      <input id="q" type="search" placeholder="Поиск: название, город, телефон или координаты">
      <div class="row"><select id="fType"></select><select id="fRegion"><option value="">Все области</option></select></div>
      <div class="row"><select id="fStatus"></select><select id="fOwner"><option value="">Все ответственные</option><option value="me">Мои</option><option value="none">Без ответственного</option></select></div>
      <div class="row" style="flex-wrap:wrap"><button class="primary" id="addBtn" type="button">+ Добавить точку</button><button id="reportBtn" type="button">Отчёт</button><button id="reload" type="button">Обновить</button><button id="logout" type="button">Выйти</button><button id="installBtn" type="button" hidden>Установить на телефон</button></div>
      <div class="k" id="vQueue" hidden></div>
      <label class="chk k"><input type="checkbox" id="fHidden"> Показать только скрытые точки</label>
      <div class="k" id="cnt"></div>
    </div>
    <ul id="list"></ul>
  </aside>
  <div class="mapwrap">
    <div id="map"></div>
    <div id="offNote" hidden></div>
    <div id="addHint" hidden>Нажмите на карту, где находится объект. <button id="addCancel" type="button">Отмена</button></div>
    <div id="panel" hidden>
      <div class="ph"><div><span class="pill" id="pType"></span><h2 id="pTitle" style="font-size:18px;margin-top:4px"></h2></div><button id="pClose" type="button" aria-label="Закрыть">✕</button></div>
      <form class="pb" id="pForm">
        <div class="coords"><span class="k">Координаты</span> <b id="pCoords"></b> <button type="button" id="pCopy">Копировать</button></div>
        <div class="row"><a class="btn primary" id="pNavi" href="#">Маршрут в Яндекс Навигаторе</a><a class="btn" id="pYmaps" href="#" target="_blank" rel="noopener">Яндекс Карты</a></div>
        <label>Название<input id="e_name" required></label>
        <div class="grid2">
          <label>Тип<select id="e_type"></select></label>
          <label>Статус<select id="e_status"></select></label>
        </div>
        <label id="reasonBox" hidden>Причина отказа (увидят все)<input id="e_reason" placeholder="Например: работают только с постоянным поставщиком"></label>
        <label>Ответственный<select id="e_owner"><option value="">—</option></select></label>
        <label>Адрес<input id="e_address"></label>
        <div class="grid2">
          <label>Телефон<input id="e_phone"></label>
          <label>Email<input id="e_email"></label>
        </div>
        <div class="grid2">
          <label>Сайт<input id="e_website"></label>
          <label>УНП<input id="e_unp"></label>
        </div>
        <label>Область<select id="e_region"></select></label>
        <label>Описание<textarea id="e_notes"></textarea></label>
        <div class="refnote" id="pRefNote" hidden></div>
        <div class="hidnote" id="pHidNote" hidden></div>
        <div class="k" id="pMeta"></div>
        <div class="row" style="flex-wrap:wrap"><button class="primary" type="submit">Сохранить</button><button type="button" id="pMove">Переместить точку</button><button type="button" id="pHide">Скрыть с карты</button><button type="button" class="danger" id="pDelete" hidden>Удалить</button></div>
        <div class="err" id="pErr"></div>
        <button type="button" class="primary" id="pVisit">Отметить визит</button>
        <div class="visit" id="visitForm" hidden>
          <h2 style="font-size:15px">Визит</h2>
          <div class="grid2"><label>Когда<input type="datetime-local" id="v_at"></label><label>Результат<select id="v_result"></select></label></div>
          <div class="grid2"><label>С кем говорили<input id="v_contact" placeholder="ФИО, должность"></label><label>Телефон контакта<input id="v_phone" type="tel"></label></div>
          <div class="grid2"><label>Что покупают, что интересует<input id="v_products"></label><label>Объём<input id="v_volume" placeholder="например, 20 м³ в месяц"></label></div>
          <div class="grid2"><label>Следующий шаг<input id="v_next" placeholder="например, отправить КП"></label><label>Когда<input type="date" id="v_next_date"></label></div>
          <label>Заметки<textarea id="v_notes" placeholder="Всё, что важно для CRM"></textarea></label>
          <div class="row"><button type="button" class="primary" id="v_save">Сохранить визит</button><button type="button" id="v_cancel">Отмена</button></div>
          <div class="err" id="v_err"></div>
        </div>
        <h2 style="font-size:15px;margin-top:6px">Визиты</h2>
        <div id="visits" style="display:grid;gap:8px"></div>
        <h2 style="font-size:15px;margin-top:6px">Комментарии</h2>
        <div id="comments" style="display:grid;gap:8px"></div>
        <textarea id="newComment" placeholder="Например: позвонили, перезвонить в понедельник"></textarea>
        <button type="button" id="addComment">Добавить комментарий</button>
      </form>
    </div>
  </div>
  <nav id="mnav"><button type="button" data-v="map" class="on">Карта</button><button type="button" data-v="list">Список</button><button type="button" id="mAdd">+ Точка</button></nav>
</div>

<div id="report" hidden>
  <div class="rbox">
    <div class="ph"><h2 style="font-size:18px">Отчёт по визитам</h2><button id="rClose" type="button" aria-label="Закрыть">✕</button></div>
    <div class="rctl">
      <label>Менеджер<select id="rUser"></select></label>
      <label>С<input type="date" id="rFrom"></label>
      <label>По<input type="date" id="rTo"></label>
      <button class="primary" id="rShow" type="button">Показать</button>
      <button id="rXlsx" type="button">Скачать Excel</button>
      <button id="rBitrix" type="button">Для Битрикс24 (CSV)</button>
    </div>
    <div class="k" id="rSum"></div>
    <div class="rtable"><table id="rTable"></table></div>
  </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="config.js"></script>
<script>
const TYPES={build:['Строительство зданий','--build',5.5],waste_collect:['Сбор неопасных отходов','--wcol',6],waste_process:['Обработка и захоронение отходов','--wproc',6.5],waste_trade:['Оптовая торговля отходами и ломом','--wtrade',6],other:['Другое','--other',5.5]};
const STATUSES={new:'Новый',to_check:'Проверить',contacted:'Связались',negotiation:'Переговоры',client:'Клиент',refused:'Отказ',closed:'Не работает'};
const RESULTS={interest:'Интерес, ждут предложение',order:'Договорились о заказе',think:'Думают',no_need:'Пока не нужно',refused:'Отказ',not_found:'Не застал, закрыто'};
// какой статус получает точка после визита (null: не меняем)
const RES_STATUS={interest:'negotiation',order:'client',think:'negotiation',no_need:'contacted',refused:'refused',not_found:null};
const REGIONS=['Брестская область','Витебская область','Гомельская область','Гродненская область','Минская область','Могилевская область','г. Минск'];
const $=id=>document.getElementById(id);
const css=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();
if(!KARTA_CONFIG.supabaseUrl){document.body.innerHTML='<p style="padding:24px">Карта ещё не подключена к базе: впишите адрес Supabase и ключ anon в config.js.</p>';throw new Error('config.js: нет supabaseUrl');}
const sb=supabase.createClient(KARTA_CONFIG.supabaseUrl,KARTA_CONFIG.supabaseAnonKey);
let me=null,profiles=[],places=[],markers=new Map(),cur=null,mode=null,map=null;

function opts(sel,obj,first){sel.innerHTML=first?`<option value="">${first}</option>`:'';for(const[k,v]of Object.entries(obj))sel.add(new Option(Array.isArray(v)?v[0]:v,k));}
opts($('v_result'),RESULTS);opts($('fType'),TYPES,'Все типы');opts($('fStatus'),STATUSES,'Все статусы');opts($('e_type'),TYPES);opts($('e_status'),STATUSES);
REGIONS.forEach(r=>{$('fRegion').add(new Option(r,r));});$('e_region').add(new Option('—',''));REGIONS.forEach(r=>$('e_region').add(new Option(r,r)));

// ---- флажки: точка, где был визит, рисуется флажком цвета своего статуса; отказ — чёрный ----
const FLAG={new:'#ffffff',to_check:'#fab005',contacted:'#1c7ed6',negotiation:'#f76707',client:'#2b8a3e',refused:'#000000',closed:'#868e96'};
const flagSvg=(c,h=26)=>`<svg width="${Math.round(h*.77)}" height="${h}" viewBox="0 0 20 26" aria-hidden="true"><path d="M3.5 25V2" stroke="#fff" stroke-width="4" stroke-linecap="round"/><path d="M3.5 25V2" stroke="#222" stroke-width="2" stroke-linecap="round"/><path d="M4.5 2.5h13l-3.4 4.6 3.4 4.6h-13z" fill="${c}" stroke="${c==='#ffffff'?'#495057':'#fff'}" stroke-width="1.3" stroke-linejoin="round"/></svg>`;
let visited=new Set(),vqIds=new Set();
const isVisited=p=>visited.has(p.id)||vqIds.has(p.id);
// размер флажка растёт с масштабом, чтобы на общем виде он был не больше соседних кружков
const flagH=()=>{const z=map?map.getZoom():12;return z<=7?16:z<=8?18:z<=10?22:z<=12?26:30;};
function flagIcon(p,on){const h=flagH()+(on?10:0),w=Math.round(h*.77);
  return L.divIcon({className:'flagicon'+(p.hidden&&!on?' hid':''),html:flagSvg(FLAG[p.status]||'#adb5bd',h),iconSize:[w,h],iconAnchor:[Math.round(h*.135),h-1],tooltipAnchor:[w/2,-h/2]});}
// меню статусов с флажками: настоящий <select> остаётся (значение и события), поверх него кнопка и список
function flagSelect(sel){
  const w=document.createElement('div');w.className='fsel';sel.after(w);sel.hidden=true;
  const b=document.createElement('button');b.type='button';b.className='fsel-btn';const ul=document.createElement('ul');ul.className='fsel-list';ul.hidden=true;w.append(b,ul);
  const ico=v=>FLAG[v]?flagSvg(FLAG[v],18):'<span class="fsel-nf"></span>';

async function applyVisit(row){const p=places.find(x=>x.id===row.place_id);if(!p)return;
  let ns=RES_STATUS[row.result];if(p.status==='client'&&ns&&ns!=='refused')ns=null;
  const patch={};if(ns&&ns!==p.status)patch.status=ns;if(!p.owner)patch.owner=row.author;
  if(Object.keys(patch).length){const{data}=await sb.from('places').update(patch).eq('id',p.id).select().single();if(data){Object.assign(p,data);refreshMarker(p);}}
  if(row.result==='refused')await sb.from('place_comments').insert({place_id:p.id,author:row.author,body:'Отказ: '+(row.notes||'')});

  vqSet(left);updQueue();if(cur)loadVisits(cur);}
function updQueue(){vqIds=new Set(vqGet().map(r=>r.place_id));const n=vqGet().filter(r=>r.author===me?.id).length,m=oqMine().length;$('vQueue').hidden=!(n||m);

// ---- правки без интернета: изменения точек, комментарии и новые точки ждут в телефоне и уходят по порядку ----
const OQ='ks_outbox',SAVED_LOCAL='Сохранено в телефоне, отправится, когда появится интернет.';
function oqGet(){try{return JSON.parse(localStorage.getItem(OQ)||'[]');}catch{return[];}}
function oqSet(a){try{localStorage.setItem(OQ,JSON.stringify(a));}catch{}}
const oqMine=()=>oqGet().filter(o=>o.author===me?.id);
function oqPush(op){const q=oqGet();q.push({...op,k:Math.random().toString(36).slice(2),author:me.id,at:new Date().toISOString()});oqSet(q);updQueue();}
const oqHas=id=>oqMine().some(o=>o.id===id||o.tmp===id);
// с сетью сохраняем сразу; без сети, или если по этой точке уже есть неотправленное, ставим в очередь
async function savePlace(id,patch){
  if(id>0&&navigator.onLine&&!oqHas(id)){
    const r=await tmo(sb.from('places').update(patch).eq('id',id).select().single(),15000);
    if(r!=='timeout'&&!(r.error&&isNet(r.error)))return r;}
  oqPush({t:'upd',id,patch});if(navigator.onLine)setTimeout(flushAll,3000);
  return{data:{...patch,updated_at:new Date().toISOString()},queued:true};}
async function addCmt(id,body){
  if(id>0&&navigator.onLine&&!oqHas(id)){
    const{error}=await sb.from('place_comments').insert({place_id:id,author:me.id,body});
    if(!error||!isNet(error))return{error};}
  oqPush({t:'cmt',id,body});return{queued:true};}
// после загрузки с сервера заново накладываем свои неотправленные правки, чтобы они не пропали с экрана
function applyPending(){for(const o of oqMine()){
  if(o.t==='ins'&&!places.some(x=>x.id===o.tmp))places.unshift({...o.place});
  if(o.t==='upd'){const p=places.find(x=>x.id===o.id);if(p)Object.assign(p,o.patch);}}}
let flushing=false;
async function flushOutbox(){if(flushing||!me||!navigator.onLine)return;flushing=true;const fails=[];
  try{for(;;){const op=oqMine()[0];if(!op)break;let res;
    if(op.t==='ins')res=await sb.from('places').insert(op.row).select().single();
    else if(op.t==='upd')res=await sb.from('places').update(op.patch).eq('id',op.id).select().single();
    else res=await sb.from('place_comments').insert({place_id:op.id,author:op.author,body:op.body,created_at:op.at});
    if(res.error&&isNet(res.error))break;
    let q=oqGet().filter(o=>o.k!==op.k);
    if(res.error){const p=places.find(x=>x.id===(op.id??op.tmp));fails.push(`«${p?.name||'точка'}»: ${res.error.message}`);}
    else if(op.t==='ins'){const id=res.data.id,p=places.find(x=>x.id===op.tmp);
      q=q.map(o=>o.id===op.tmp?{...o,id}:o);vqSet(vqGet().map(r=>r.place_id===op.tmp?{...r,place_id:id}:r));
      markers.get(op.tmp)?.remove();markers.delete(op.tmp);if(cur===op.tmp)cur=id;
      if(p){Object.assign(p,res.data);refreshMarker(p);}}
    else if(op.t==='upd'){const p=places.find(x=>x.id===op.id);if(p&&res.data){Object.assign(p,res.data);applyPending();refreshMarker(p);}}
    oqSet(q);}}
  finally{flushing=false;updQueue();}
  if(fails.length)alert('Не удалось отправить '+fails.length+' правк(и):\n'+fails.join('\n'));
  if(cur)loadComments(cur);}
async function loadVisits(id){const box=$('visits');box.innerHTML='';
  const q=vqGet().filter(r=>r.place_id===id).map(r=>({...r,queued:true}));
  const{data,error}=await sb.from('visits').select('*').eq('place_id',id).order('visited_at',{ascending:false});
  const all=q.concat(error?[]:data);
  // флажок на карте следует за визитами: удалили последний — точка снова кружок
  const pl=places.find(x=>x.id===id);
  if(pl&&!error){const was=isVisited(pl);data.length?visited.add(id):visited.delete(id);if(isVisited(pl)!==was){refreshMarker(pl);}}
  if(!all.length){box.innerHTML=`<span class="k">${error&&!q.length?(isNet(error)?'Визиты появятся, когда будет интернет.':'Визиты ещё не включены (нужен скрипт update_visits.sql).'):'Визитов пока не было.'}</span>`;return;}
  all.forEach(v=>{const d=document.createElement('div');d.className='vitem'+(v.queued?' queued':'');const a=profiles.find(x=>x.id===v.author);
    d.innerHTML='<div class="k"></div><div><b></b></div><div></div>';
    d.children[0].textContent=(a?.full_name||'—')+' · '+new Date(v.visited_at).toLocaleString('ru-RU')+(v.queued?' · ждёт отправки':'');
    d.children[1].firstChild.textContent=RESULTS[v.result]||v.result;
    d.children[2].textContent=[v.contact_name&&('Контакт: '+v.contact_name+(v.contact_phone?', '+v.contact_phone:'')),v.products&&('Интересует: '+v.products),v.volume&&('Объём: '+v.volume),
      v.next_step&&('Дальше: '+v.next_step+(v.next_date?' до '+new Date(v.next_date).toLocaleDateString('ru-RU'):'')),v.notes].filter(Boolean).join('\n');
    d.children[2].style.whiteSpace='pre-line';
    // удалить визит может его автор или админ; статус точки при этом не откатывается
    if(v.author===me.id||profiles.find(x=>x.id===me.id)?.role==='admin'){const b=document.createElement('button');b.type='button';b.className='del danger';b.textContent='Удалить';
      b.onclick=async()=>{if(b.dataset.confirm!=='1'){b.dataset.confirm='1';b.textContent='Точно удалить?';return;}
        if(v.queued){vqSet(vqGet().filter(r=>!(r.place_id===v.place_id&&r.visited_at===v.visited_at&&r.author===v.author)));updQueue();}
        else{const{error}=await sb.from('visits').delete().eq('id',v.id);if(error){b.textContent='Не удалилось';return;}}
        loadVisits(id);};
      d.prepend(b);}
    box.appendChild(d);});
}

// ---- отчёт: визиты и комментарии за период, выгрузка в Excel для переноса в CRM ----
let rRows=[],rComments=[],rVisits=[];
$('reportBtn').onclick=()=>{const u=$('rUser');u.innerHTML='';u.add(new Option('Все менеджеры',''));profiles.forEach(p=>u.add(new Option(p.full_name||p.id,p.id)));
  if(!$('rFrom').value){const t=new Date();$('rTo').value=dstr(t);t.setDate(t.getDate()-13);$('rFrom').value=dstr(t);}
  $('report').hidden=false;showReport();};
$('rClose').onclick=()=>{$('report').hidden=true;};
$('rShow').onclick=showReport;
const pname=id=>profiles.find(x=>x.id===id)?.full_name||'—';
async function showReport(){
  const from=new Date($('rFrom').value+'T00:00'),to=new Date($('rTo').value+'T00:00');to.setDate(to.getDate()+1);const u=$('rUser').value;
  $('rSum').textContent='Загружаю…';$('rTable').innerHTML='';
  let qv=sb.from('visits').select('*').gte('visited_at',from.toISOString()).lt('visited_at',to.toISOString()).order('visited_at');
  let qc=sb.from('place_comments').select('*').gte('created_at',from.toISOString()).lt('created_at',to.toISOString()).order('created_at');
  if(u){qv=qv.eq('author',u);qc=qc.eq('author',u);}
  const[{data:vs,error:e1},{data:cs}]=await Promise.all([qv,qc]);
  if(e1){$('rSum').textContent=/visits/.test(e1.message)?'Визиты ещё не включены: администратору нужно один раз выполнить SQL-скрипт update_visits.sql в Supabase.':'Ошибка: '+e1.message;return;}
  const P=id=>places.find(x=>x.id===id)||{};rVisits=vs;
  rRows=vs.map(v=>{const p=P(v.place_id);return{'Дата визита':new Date(v.visited_at).toLocaleString('ru-RU'),'Менеджер':pname(v.author),'Компания':p.name||'',
    'Тип':(TYPES[p.type]||[p.type||''])[0],'Область':p.region||'','Адрес':p.address||'','УНП':p.unp||'','Телефон компании':p.phone||'','Email':p.email||'','Сайт':p.website||'',
    'Контактное лицо':v.contact_name||'','Телефон контакта':v.contact_phone||'','Результат':RESULTS[v.result]||v.result,'Статус точки сейчас':STATUSES[p.status]||p.status||'',
    'Что интересует':v.products||'','Объём':v.volume||'','Следующий шаг':v.next_step||'','Срок следующего шага':v.next_date?new Date(v.next_date).toLocaleDateString('ru-RU'):'',
    'Заметки':v.notes||'','Координаты точки':p.lat!=null?`${(+p.lat).toFixed(6)}, ${(+p.lon).toFixed(6)}`:'','id точки':v.place_id,_id:v.place_id};});
  rComments=(cs||[]).map(c=>{const p=P(c.place_id);return{'Дата':new Date(c.created_at).toLocaleString('ru-RU'),'Менеджер':pname(c.author),'Компания':p.name||'','Область':p.region||'','Комментарий':c.body,'id точки':c.place_id};});
  const byRes={};vs.forEach(v=>{const k=RESULTS[v.result]||v.result;byRes[k]=(byRes[k]||0)+1;});
  $('rSum').textContent=`Визитов: ${vs.length}`+(vs.length?' ('+Object.entries(byRes).map(([k,n])=>k.toLowerCase()+': '+n).join(', ')+')':'')+`. Комментариев за период: ${rComments.length}.`+(vs.length?' Нажмите на компанию, чтобы открыть её на карте.':'');
  const cols=['Дата визита','Менеджер','Компания','Область','Контактное лицо','Телефон контакта','Результат','Что интересует','Объём','Следующий шаг','Срок следующего шага','Заметки'];
  const t=$('rTable');const hr=t.insertRow();cols.forEach(c=>{const th=document.createElement('th');th.textContent=c;hr.appendChild(th);});
  rRows.forEach(r=>{const tr=t.insertRow();cols.forEach(c=>{const td=tr.insertCell();td.textContent=r[c];if(c==='Компания'){td.className='c';td.onclick=()=>{$('report').hidden=true;openPlace(r._id,true);};}});});
}
async function loadXLSX(){if(window.XLSX)return;await new Promise((ok,bad)=>{const s=document.createElement('script');s.src='https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';s.onload=ok;s.onerror=bad;document.head.appendChild(s);});}
$('rXlsx').onclick=async()=>{if(!rRows.length&&!rComments.length){$('rSum').textContent='За выбранный период нечего выгружать.';return;}
  try{await loadXLSX();}catch{$('rSum').textContent='Не загрузился модуль Excel, проверьте интернет.';return;}
  const wb=XLSX.utils.book_new(),clean=rRows.map(({_id,...r})=>r);
  XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(clean.length?clean:[{'Визитов нет':''}]),'Визиты');
  XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(rComments.length?rComments:[{'Комментариев нет':''}]),'Комментарии');
  const u=$('rUser').value?' '+pname($('rUser').value):'';XLSX.writeFile(wb,`Визиты${u} ${$('rFrom').value} — ${$('rTo').value}.xlsx`);};

// Битрикс24 принимает в CRM только CSV; на шаге сопоставления полей колонки можно переназначить.
// Одна строка на компанию: все визиты за период собраны в комментарий лида.
$('rBitrix').onclick=()=>{if(!rVisits.length){$('rSum').textContent='За выбранный период визитов нет, выгружать нечего.';return;}
  const by=new Map();rVisits.forEach(v=>{by.has(v.place_id)?by.get(v.place_id).push(v):by.set(v.place_id,[v]);});
  const rows=[...by].map(([id,vs])=>{const p=places.find(x=>x.id===id)||{},last=vs[vs.length-1],c=[...vs].reverse().find(v=>v.contact_name||v.contact_phone)||{};
    const com=vs.map(v=>[new Date(v.visited_at).toLocaleDateString('ru-RU')+', '+pname(v.author)+': '+(RESULTS[v.result]||v.result),
      v.contact_name&&('Контакт: '+v.contact_name+(v.contact_phone?', '+v.contact_phone:'')),v.products&&('Интересует: '+v.products),v.volume&&('Объём: '+v.volume),
      v.next_step&&('Следующий шаг: '+v.next_step+(v.next_date?' до '+new Date(v.next_date).toLocaleDateString('ru-RU'):'')),v.notes].filter(Boolean).join('. ')).join('\n');
    const extra=[p.unp&&('УНП: '+p.unp),c.contact_phone&&p.phone&&c.contact_phone!==p.phone&&('Телефон компании: '+p.phone),p.lat!=null&&(`Координаты: ${(+p.lat).toFixed(6)}, ${(+p.lon).toFixed(6)}`),'Карта: точка №'+id].filter(Boolean).join('\n');
    return{'Название лида':`${p.name||'Компания'}: ${RESULTS[last.result]||last.result}`,'Название компании':p.name||'','Имя':c.contact_name||'','Рабочий телефон':c.contact_phone||p.phone||'',
      'Рабочий e-mail':p.email||'','Корпоративный сайт':p.website||'','Адрес':[p.address,p.region].filter(Boolean).join(', '),'Ответственный':pname(last.author),'Комментарий':com+'\n'+extra};});
  const cols=Object.keys(rows[0]),q=x=>'"'+String(x??'').replace(/"/g,'""')+'"';
  const csv='﻿'+[cols.map(q).join(',')].concat(rows.map(r=>cols.map(c=>q(r[c])).join(','))).join('\r\n');
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));
  a.download=`Битрикс24 лиды ${$('rFrom').value} — ${$('rTo').value}.csv`;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),5000);
  $('rSum').textContent=`Выгружено лидов: ${rows.length} (по одному на компанию, все визиты в комментарии).`;};

boot();
</script>
